name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm run lint
      - run: npm run build

  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Dependency and static security audit
        run: |
          pip install pip-audit bandit
          pip-audit -r backend/requirements.txt
          bandit -r backend -x backend/security_smoke.py,backend/genealogy_smoke.py,backend/query_normalizer_smoke.py,backend/terminology_resolver_smoke.py,backend/canonical_metadata_smoke.py
      - run: python -m compileall -q backend
      - name: Import FastAPI application
        env:
          RESEARCH_DB_PATH: /tmp/crypto-explorer-ci.db
        run: cd backend && python -c "from api import app; assert app.title == 'Crypto Explorer API'"
      - name: Security regression smoke test
        run: python backend/security_smoke.py
      - name: Concept genealogy regression smoke test
        run: cd backend && python genealogy_smoke.py
      - name: Chinese academic query normalization smoke test
        run: cd backend && python query_normalizer_smoke.py
      - name: Self-learning terminology resolver regression smoke test
        run: cd backend && python terminology_resolver_smoke.py
      - name: Canonical publication metadata regression smoke test
        run: cd backend && python canonical_metadata_smoke.py

  docker:
    name: Docker Compose
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config
      - run: docker compose build

