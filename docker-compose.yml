name: crypto-explorer

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: crypto_explorer_frontend
    ports:
      - "${APP_PORT:-3000}:3000"
    init: true
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: crypto_explorer_backend
    expose:
      - "8000"
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - ENABLE_EPRINT_LOOKUP=${ENABLE_EPRINT_LOOKUP:-false}
      - CORS_ORIGINS=
      - SEMANTIC_SCHOLAR_API_KEY=${SEMANTIC_SCHOLAR_API_KEY:-}
      - OPENALEX_API_KEY=${OPENALEX_API_KEY:-}
      - OPENALEX_MAILTO=${OPENALEX_MAILTO:-}
      - RESEARCH_DB_PATH=/app/data/research.db
      - SESSION_TTL_HOURS=${SESSION_TTL_HOURS:-24}
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      - ENABLE_API_DOCS=${ENABLE_API_DOCS:-false}
      - MAX_REQUEST_BYTES=${MAX_REQUEST_BYTES:-6291456}
    volumes:
      - crypto_explorer_data:/app/data
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  crypto_explorer_data:
